<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Iniciar sesión</title>

        <style>

            * {
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;
            }

            body {
                margin: 0;
                min-height: 100vh;

                display: flex;
                align-items: center;
                justify-content: center;

                background: #eef2f5;
                color: #263238;
            }

            .login-contenedor {

                width: 100%;
                max-width: 420px;

                padding: 20px;
            }

            .login-card {

                background: white;

                border-radius: 10px;

                padding: 32px;

                border: 1px solid #dfe5e9;

                box-shadow:
                    0 6px 20px rgba(0, 0, 0, 0.08);
            }

            .logo-area {
                text-align: center;
                margin-bottom: 28px;
            }

            .logo-icono {

                width: 62px;
                height: 62px;

                margin: 0 auto 14px;

                border-radius: 50%;

                display: flex;
                align-items: center;
                justify-content: center;

                background: #14476b;
                color: white;

                font-size: 27px;
                font-weight: bold;
            }

            .logo-area h1 {

                margin: 0;

                color: #16374f;

                font-size: 23px;
            }

            .logo-area p {

                margin: 7px 0 0;

                color: #607d8b;

                font-size: 14px;
            }

            .campo {
                margin-bottom: 18px;
            }

            label {

                display: block;

                margin-bottom: 7px;

                font-size: 14px;

                font-weight: bold;

                color: #37474f;
            }

            input {

                width: 100%;

                padding: 12px 13px;

                border: 1px solid #cfd8dc;

                border-radius: 5px;

                font-size: 14px;
            }

            input:focus {

                outline: none;

                border-color: #0f5ca8;

                box-shadow:
                    0 0 0 2px rgba(15, 92, 168, 0.08);
            }

            .btn-login {

                width: 100%;

                border: none;

                border-radius: 5px;

                padding: 12px;

                background: #0f5ca8;

                color: white;

                font-size: 15px;

                font-weight: bold;

                cursor: pointer;

                margin-top: 5px;
            }

            .btn-login:hover {
                background: #0b4a88;
            }

            .mensaje {

                padding: 11px 13px;

                margin-bottom: 18px;

                border-radius: 5px;

                font-size: 13px;
            }

            .mensaje-error {

                background: #fdeaea;

                color: #a12828;

                border: 1px solid #f0c2c2;
            }

            .mensaje-exito {

                background: #e7f7ee;

                color: #1d6b43;

                border: 1px solid #bfe4d0;
            }

            .pie {

                margin-top: 22px;

                text-align: center;

                color: #78909c;

                font-size: 12px;
            }

        </style>

    </head>

    <body>

        <div class="login-contenedor">

            <div class="login-card">

                <div class="logo-area">

                    <div class="logo-icono">
                        TI
                    </div>

                    <h1>
                        Sistema de Activos TI
                    </h1>

                    <p>
                        Control y asignación de activos tecnológicos
                    </p>

                </div>


                <!-- ERROR DE LOGIN -->

                <div
                    class="mensaje mensaje-error"

                    th:if="${param.error}">

                    Usuario, contraseña o estado de cuenta incorrecto.

                </div>


                <!-- LOGOUT CORRECTO -->

                <div
                    class="mensaje mensaje-exito"

                    th:if="${param.logout}">

                    Sesión cerrada correctamente.

                </div>


                <!--
                    Spring Security procesa este formulario.
                    No necesitamos crear un POST en LoginController.
                -->

                <form
                    method="post"
                    th:action="@{/login}">

                    <div class="campo">

                        <label>
                            Usuario
                        </label>

                        <input
                            type="text"
                            name="username"
                            placeholder="Ingrese su usuario"
                            autocomplete="username"
                            autofocus
                            required>

                    </div>


                    <div class="campo">

                        <label>
                            Contraseña
                        </label>

                        <input
                            type="password"
                            name="password"
                            placeholder="Ingrese su contraseña"
                            autocomplete="current-password"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn-login">

                        Iniciar sesión

                    </button>

                </form>


                <div class="pie">

                    Acceso restringido al personal autorizado.

                </div>

            </div>

        </div>

    </body>

</html>
