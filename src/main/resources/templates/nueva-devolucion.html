<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Registrar devolución</title>

        <style>

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background: #f4f6f8;
                color: #1f2937;
            }

            .header {
                background: #0f3d63;
                color: white;
                padding: 18px 30px;
            }

            .header h1 {
                margin: 0;
                font-size: 24px;
            }

            .header p {
                margin: 5px 0 0;
                opacity: 0.85;
            }

            .contenedor {
                width: 90%;
                max-width: 850px;
                margin: 30px auto;
            }

            .tarjeta {
                background: white;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            }

            .info {
                background: #eff6ff;
                border-left: 4px solid #0f5ca8;
                padding: 15px;
                border-radius: 5px;
                margin-bottom: 25px;
            }

            .info p {
                margin: 6px 0;
            }

            label {
                display: block;
                font-weight: bold;
                margin-bottom: 7px;
            }

            textarea {
                width: 100%;
                min-height: 100px;
                padding: 10px;
                border: 1px solid #cbd5e1;
                border-radius: 6px;
                resize: vertical;
            }

            .advertencia {
                background: #fef3c7;
                color: #92400e;
                padding: 12px;
                border-radius: 6px;
                margin-top: 20px;
            }

            .botones {
                display: flex;
                justify-content: flex-end;
                gap: 12px;
                margin-top: 25px;
            }

            .btn {
                padding: 11px 18px;
                border-radius: 6px;
                border: none;
                font-weight: bold;
                text-decoration: none;
                cursor: pointer;
            }

            .btn-confirmar {
                background: #198754;
                color: white;
            }

            .btn-cancelar {
                background: #e5e7eb;
                color: #374151;
            }

        </style>

    </head>

    <body>

        <header class="header">

            <h1>Sistema de Control de Activos TI</h1>

            <p>Registro de devolución de activo</p>

        </header>


        <main class="contenedor">

            <div class="tarjeta">

                <h2>Registrar devolución</h2>


                <div class="info">

                    <p>
                        <strong>Colaborador:</strong>

                        <span th:text="${devolucion.asignacion.colaborador.nombreCompleto}">
                        </span>
                    </p>

                    <p>
                        <strong>Inventario:</strong>

                        <span th:text="${devolucion.asignacion.activo.numeroInventario}">
                        </span>
                    </p>

                    <p>
                        <strong>Equipo:</strong>

                        <span th:text="${devolucion.asignacion.activo.tipoEquipo.nombreTipo}">
                        </span>
                    </p>

                    <p>
                        <strong>Modelo:</strong>

                        <span th:text="${devolucion.asignacion.activo.modelo}">
                        </span>
                    </p>

                </div>


                <form th:action="@{/devoluciones/guardar}"
                      th:object="${devolucion}"
                      method="post">

                    <input type="hidden"
                           th:field="*{asignacion.idAsignacion}">


                    <label>Observaciones de la devolución</label>

                    <textarea th:field="*{observaciones}"
                              placeholder="Estado físico observado, accesorios entregados, comentarios...">
                    </textarea>


                    <div class="advertencia">

                        El activo quedará como
                        <strong>DEVUELTO_PENDIENTE_REVISION</strong>.

                        No estará disponible para una nueva asignación
                        hasta que Soporte TI finalice su revisión.

                    </div>


                    <div class="botones">

                        <a th:href="@{/asignaciones}"
                           class="btn btn-cancelar">
                            Cancelar
                        </a>

                        <button type="submit"
                                class="btn btn-confirmar">
                            Confirmar devolución
                        </button>

                    </div>

                </form>

            </div>

        </main>

    </body>
</html>
