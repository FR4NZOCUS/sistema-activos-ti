spring.application.name=sistema-activos-ti

# ===============================
# BASE DE DATOS MYSQL
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_activos_ti?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF
# ===============================

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ===============================
# SERVIDOR
# ===============================

server.port=${PORT:8080}
